    <script>
      (function() {
        // AI Studio preview operates in a sandboxed iframe without HMR WebSocket support.
        // Intercept and suppress unhandled WebSocket connection errors from @vite/client.
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || reason.stack || String(reason)) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('vite-hmr') ||
            msg.includes('vite-ping') ||
            msg.includes('@vite/client') ||
            (reason && reason.stack && reason.stack.includes('@vite/client'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.filename)) ? String(event.message || '') : '';
          if (msg.includes('WebSocket') || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Safe stub for Vite dev HMR websocket
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isHmr = (protocols === 'vite-hmr' || protocols === 'vite-ping' || (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/'))));
            if (!isHmr) {
              return new OrigWS(url, protocols);
            }
            var target = new EventTarget();
            target.binaryType = 'blob';
            target.readyState = 1;
            target.url = url;
            target.protocol = protocols || '';
            target.extensions = '';
            target.bufferedAmount = 0;
            target.send = function() {};
            target.close = function() {
              target.readyState = 3;
              target.dispatchEvent(new Event('close'));
            };
            setTimeout(function() {
              target.readyState = 1;
              target.dispatchEvent(new Event('open'));
            }, 0);
            return target;
          }
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          ViteSafeWebSocket.prototype = OrigWS.prototype;
          window.WebSocket = ViteSafeWebSocket;
        }
      })();
    </script>
